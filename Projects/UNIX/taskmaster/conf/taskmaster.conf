# Ejemplo de configuración para taskmaster
# subject: Chapter VII.1

programs:
  ticker:
    cmd: "/bin/sh -c 'while true; do echo tick $(date +%s); sleep 1; done'"
    numprocs: 1
    umask: 022
    workingdir: /tmp
    autostart: true
    autorestart: unexpected
    exitcodes: [0]
    startretries: 3
    starttime: 1
    stopsignal: TERM
    stoptime: 5
    stdout: /tmp/ticker.stdout
    stderr: discard
    env:
      STARTED_BY: taskmaster
      ANSWER: 42

  worker:
    cmd: "/bin/sleep 3600"
    numprocs: 2
    umask: 077
    workingdir: /tmp
    autostart: true
    autorestart: true
    exitcodes: 0
    startretries: 3
    starttime: 1
    stopsignal: USR1
    stoptime: 10
    stdout: discard
    stderr: discard
